authors = [
    { name = "Hari", email = "anshari94432@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "flake8>=7.3.0",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.4",
    "langchain-huggingface>=1.2.2",
    "numpy>=2.5.2",
